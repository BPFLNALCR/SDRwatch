name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint & Smoke Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Python deps
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true  # keep CI green while you iterate

      - name: Type check (mypy)
        run: mypy .
        continue-on-error: true  # optional at this stage

      - name: Pytest (no hardware)
        run: python -m pytest -q tests

      - name: Simulated scan smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m sdrwatch.cli \
            --driver sim \
            --profile fm_broadcast \
            --baseline-id latest \
            --start 88e6 \
            --stop 108e6 \
            --db ci-sim.db \
            --repeat 2

          python - <<'PY'
          import sqlite3

          con = sqlite3.connect("ci-sim.db")
          try:
              assert con.execute("SELECT COUNT(*) FROM baselines").fetchone()[0] >= 1
              assert con.execute("SELECT COUNT(*) FROM scan_updates").fetchone()[0] >= 1
              assert con.execute("SELECT COUNT(*) FROM baseline_detections").fetchone()[0] >= 1
              print("Simulated scan smoke OK")
          finally:
              con.close()
          PY

      - name: Smoke tests (imports & --help)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sdrwatch.cli
          from sdrwatch_web import create_app

          create_app('does-not-exist.db')
          print("Imports OK")
          PY

          # Ensure scripts parse and --help works (no hardware needed)
          if [ -f "sdrwatch.py" ]; then
            python sdrwatch.py --help > /dev/null
            echo "sdrwatch.py --help OK"
          fi
          if [ -f "sdrwatch-control.py" ]; then
            python sdrwatch-control.py --help > /dev/null
            echo "sdrwatch-control.py --help OK"
          fi
          if [ -f "sdrwatch-web.py" ]; then
            python sdrwatch-web.py --help > /dev/null
            echo "sdrwatch-web.py --help OK"
          fi
